name: Android and Debian builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export BUILD_VERSION="${GITHUB_REF_NAME#v}"; else export BUILD_VERSION="$(cat VERSION)"; fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Tagged releases require all Android signing secrets." >&2
              exit 1
            fi
          fi
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          ./tests/cli_test.sh
          ./gradlew clean lint test assembleDebug assembleRelease
          cp app/build/outputs/apk/debug/app-debug.apk "termux-background-${BUILD_VERSION}-debug.apk"
          release_apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$release_apk"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$release_apk"
          fi
          cp "$release_apk" "termux-background-${BUILD_VERSION}.apk"
      - name: Build Debian package and checksums
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(cat VERSION)"; fi
          BUILD_VERSION="$VERSION" ./build-deb.sh
          BUILD_VERSION="$VERSION" ./tests/package_test.sh
          sha256sum "termux-background-$VERSION-debug.apk" "termux-background-$VERSION.apk" > SHA256SUMS
          sha256sum "termux-background_${VERSION}_all.deb" >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: termux-background-${{ github.sha }}
          if-no-files-found: error
          path: |
            termux-background-*.apk
            termux-background_*.deb
            SHA256SUMS

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: termux-background-${{ github.sha }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
